name: Test APK

# Builds the app from this branch and publishes the APK as a pre-release, so it can be downloaded straight to a phone.
on:
  push:
    branches: [ccr-29fcc202-3nc3bt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch bundled components (checked against tools/components.sha256)
        run: bash tools/fetch_components.sh

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :app:assembleModernRelease

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="WoW-Forever-verify-login-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/modern/release/app-modern-release.apk "$APK"
          gh release create "verify-login-${{ github.run_number }}" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Test build: Verify Login (${{ github.run_number }})" \
            --notes "Test build of WoW Forever with the BLZ51914400 Verify Login fix, built from ${{ github.sha }}. It is signed with a temporary debug key: uninstall the official app before installing it."
